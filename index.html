<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中药新药研发项目管理平台</title>
<style>
:root{
  --primary:#1a6f8a; --primary-dark:#12556b; --accent:#c8a24b;
  --bg:#f4f6f8; --card:#ffffff; --text:#2b3a42; --muted:#7a8a93;
  --green:#3a9d6e; --orange:#e08a2e; --red:#c94f4f; --gray:#aab6bd;
  --radius:10px; --shadow:0 1px 4px rgba(30,60,75,.08),0 4px 14px rgba(30,60,75,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:linear-gradient(120deg,var(--primary),var(--primary-dark));color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
header h1{font-size:20px;font-weight:600;letter-spacing:1px}
header .sub{font-size:12px;opacity:.85;margin-top:4px}
header .actions button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;margin-left:8px}
header .actions button:hover{background:rgba(255,255,255,.28)}
nav{background:var(--card);display:flex;padding:0 28px;border-bottom:1px solid #e3e9ec;position:sticky;top:0;z-index:50}
nav button{background:none;border:none;padding:14px 20px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;font-family:inherit}
nav button.active{color:var(--primary);border-bottom-color:var(--accent);font-weight:600}
nav button:hover{color:var(--primary)}
main{padding:24px 28px;max-width:1400px;margin:0 auto}
.page{display:none}.page.active{display:block}
h2.section{font-size:16px;margin:6px 0 16px;color:var(--primary-dark);border-left:4px solid var(--accent);padding-left:10px}
/* 看板 */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mod{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.mod h3{font-size:15px;margin-bottom:4px}
.mod .phase{font-size:12px;color:var(--muted);margin-bottom:12px}
.bar-wrap{background:#eef2f4;border-radius:6px;height:8px;overflow:hidden;margin-bottom:8px}
.bar{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary),#3fa3bd);transition:width .5s}
.mod .pct{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:10px}
.mod ul{list-style:none;font-size:13px}
.mod li{padding:5px 0;border-top:1px dashed #edf1f3;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.d-done{background:var(--green)}.d-doing{background:var(--orange)}.d-todo{background:var(--gray)}.d-hold{background:var(--red)}
/* 甘特图 */
.gantt-scroll{overflow-x:auto;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.gantt{display:grid;min-width:900px}
.g-head{display:flex;border-bottom:2px solid #e3e9ec;padding-bottom:8px;font-size:12px;color:var(--muted)}
.g-task-col{width:230px;flex-shrink:0;padding-right:10px;font-weight:600;color:var(--text)}
.g-timeline{flex:1;position:relative}
.g-months{display:flex}
.g-month{flex:1;text-align:center;border-left:1px solid #eef2f4;font-size:11px;white-space:nowrap;padding:2px 0}
.g-row{display:flex;align-items:center;border-bottom:1px solid #f2f5f7;padding:7px 0}
.g-name{width:230px;flex-shrink:0;padding-right:10px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-track{flex:1;position:relative;height:20px}
.g-bar{position:absolute;height:16px;top:2px;border-radius:4px;font-size:10px;color:#fff;line-height:16px;padding:0 6px;overflow:hidden;white-space:nowrap;cursor:default}
.st-todo{background:var(--gray)}.st-doing{background:var(--orange)}.st-done{background:var(--green)}.st-hold{background:var(--red)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin:12px 0;flex-wrap:wrap}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
/* 表格通用 */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
select,input[type=text],input[type=date]{padding:8px 10px;border:1px solid #d6dee2;border-radius:6px;font-size:13px;font-family:inherit;background:#fff;color:var(--text)}
.btn{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
.btn:hover{background:var(--primary-dark)}
.btn.sm{padding:4px 10px;font-size:12px;background:#eef3f5;color:var(--primary);border:1px solid #d6dee2}
.btn.sm:hover{background:#dce9ee}
.btn.del{background:#fdf0f0;color:var(--red);border-color:#f0d5d5}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f2f6f8;color:var(--primary-dark);text-align:left;padding:10px 8px;font-weight:600;white-space:nowrap}
td{padding:9px 8px;border-top:1px solid #eef2f4;vertical-align:middle}
tr:hover td{background:#f8fbfc}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;white-space:nowrap}
.b-未开始{background:#eef1f3;color:#7a8a93}.b-进行中{background:#fdf3e4;color:#b96f14}
.b-已完成{background:#e6f4ec;color:#22784f}.b-暂停{background:#fbeaea;color:#a83a3a}
.tname{cursor:pointer}.tname:hover{color:var(--primary);text-decoration:underline}
/* 文件 */
.file-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.fitem{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid #eef2f4;border-radius:8px;margin-top:8px;font-size:13px;background:#fbfdfe}
.fitem a{color:var(--primary);text-decoration:none;word-break:break-all}
.fitem a:hover{text-decoration:underline}
.empty{color:var(--muted);font-size:12px;padding:8px 0}
/* 里程碑 */
.timeline{position:relative;padding-left:26px}
.timeline:before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:#d9e4e9}
.mi{position:relative;margin-bottom:22px}
.mi:before{content:'';position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary)}
.mi.done:before{background:var(--green);box-shadow:0 0 0 2px var(--green)}
.mi h4{font-size:14px}.mi p{font-size:12px;color:var(--muted);margin-top:3px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2b3a42;color:#fff;padding:10px 22px;border-radius:8px;font-size:13px;display:none;z-index:99}
@media(max-width:700px){main{padding:14px}nav{padding:0 10px;overflow-x:auto}header{padding:14px}}


input[type=email],input[type=password]{padding:8px 10px;border:1px solid #d6dee2;border-radius:6px;font-size:13px;font-family:inherit;background:#fff;color:var(--text)}
</style>
</head>
<body>
<header>
  <div>
    <h1>🌿 中药新药研发项目管理平台</h1>
    <div class="sub">药学研究 · 委外非临床 · 临床方案 · IND申报 &nbsp;|&nbsp; 数据保存在本地浏览器，定期导出备份</div>
  </div>
  <div class="actions">
    <button onclick="exportData()">导出备份</button>
    <button onclick="document.getElementById('importFile').click()">导入备份</button>
    <button id="sbOutBtn" style="display:none" onclick="doLogout()">登出</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</header>
<nav>
  <button class="active" onclick="showPage('dash',this)">总览看板</button>
  <button onclick="showPage('gantt',this)">甘特图</button>
  <button onclick="showPage('tasks',this)">任务清单</button>
  <button onclick="showPage('files',this)">文件管理</button>
  <button onclick="showPage('mile',this)">里程碑</button>
</nav>
<main>
  <!-- 看板 -->
  <div class="page active" id="dash">
    <h2 class="section">项目总览（点击任务可跳转编辑）</h2>
    <div class="board" id="board"></div>
  </div>
  <!-- 甘特图 -->
  <div class="page" id="gantt">
    <h2 class="section">项目甘特图</h2>
    <div class="legend">
      <span><i style="background:var(--green)"></i>已完成</span>
      <span><i style="background:var(--orange)"></i>进行中</span>
      <span><i style="background:var(--gray)"></i>未开始</span>
      <span><i style="background:var(--red)"></i>暂停</span>
    </div>
    <div class="gantt-scroll"><div class="gantt" id="ganttBox"></div></div>
  </div>
  <!-- 任务 -->
  <div class="page" id="tasks">
    <h2 class="section">任务清单</h2>
    <div class="card">
      <div class="toolbar">
        <select id="fMod" onchange="renderTasks()"><option value="">全部模块</option></select>
        <select id="fStatus" onchange="renderTasks()">
          <option value="">全部状态</option><option>未开始</option><option>进行中</option><option>已完成</option><option>暂停</option>
        </select>
        <button class="btn" onclick="startAdd()">＋ 新增任务</button>
      </div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>模块</th><th>任务 / 交付物</th><th>开始</th><th>结束</th><th>负责人</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="taskBody"></tbody>
      </table></div>
    </div>
  </div>
  <!-- 文件 -->
  <div class="page" id="files">
    <h2 class="section">文件管理（按模块归档，可挂网盘/文档链接）</h2>
    <div class="file-cols" id="fileBox"></div>
  </div>
  <!-- 里程碑 -->
  <div class="page" id="mile">
    <h2 class="section">关键里程碑（IND倒排）</h2>
    <div class="card"><div class="timeline" id="mileBox"></div></div>
  </div>
</main>
<div id="loginMask" style="display:none;position:fixed;inset:0;background:rgba(20,40,50,.55);z-index:200;align-items:center;justify-content:center">
<div style="background:#fff;border-radius:12px;padding:28px;width:340px;box-shadow:0 8px 30px rgba(0,0,0,.25)">
  <h3 style="color:var(--primary-dark);margin-bottom:14px">☁️ 云端账号登录</h3>
  <div id="cfgBox">
    <p style="font-size:12px;color:var(--muted);margin-bottom:10px">首次使用：请先填写 Supabase 连接信息（只存在这台电脑，填一次即可）</p>
    <input type="text" id="sbUrl" placeholder="Supabase URL（https://xxxx.supabase.co）" style="width:100%;margin-bottom:8px">
    <input type="text" id="sbKey" placeholder="anon public key" style="width:100%;margin-bottom:10px">
    <button class="btn" style="width:100%" onclick="saveCfg()">保存配置</button>
    <p id="cfgMsg" style="font-size:12px;color:var(--red);margin-top:8px"></p>
  </div>
  <div id="authBox" style="display:none">
    <input type="email" id="sbEmail" placeholder="邮箱" style="width:100%;margin-bottom:8px">
    <input type="password" id="sbPwd" placeholder="密码" style="width:100%;margin-bottom:12px">
    <button class="btn" style="width:100%;margin-bottom:8px" onclick="doLogin()">登录</button>
    <button class="btn sm" style="width:100%" onclick="doSignup()">首次使用，注册新账号</button>
    <p id="authMsg" style="font-size:12px;color:var(--muted);margin-top:10px"></p>
    <p style="text-align:center;margin-top:10px"><a href="javascript:void(0)" onclick="skipLogin()" style="font-size:12px;color:var(--muted)">暂不登录，仅本地使用</a> · <a href="javascript:void(0)" onclick="resetCfg()" style="font-size:12px;color:var(--muted)">重新配置连接信息</a></p>
  </div>
</div>
</div>
<footer>本工具为研发辅助管理用途 · 关键原始数据请同步保存至受控系统</footer>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ 数据层 ============ */
var MODULES = ["药材饮片研究","炮制研究","小试工艺研究","质量研究","方法学验证","稳定性研究","中试研究","委外非临床研究","临床方案撰写","IND申报"];
var STATUSES = ["未开始","进行中","已完成","暂停"];
var KEY='tcmPmsV1';
var defaultTasks=[
 // 模块, 任务, 开始, 结束, 负责人, 状态, 交付物
 ["药材饮片研究","药材基源与产地考察","2026-11-01","2026-12-15","","进行中","药材基源鉴定报告、产地考察记录"],
 ["药材饮片研究","饮片质量标准草案","2026-12-01","2027-01-31","","未开始","饮片质量标准草案"],
 ["炮制研究","炮制工艺优选","2027-01-01","2027-03-31","","未开始","炮制工艺研究资料"],
 ["炮制研究","炮制成品质量标准","2027-03-01","2027-04-30","","未开始","炮制品质量标准草案"],
 ["小试工艺研究","提取纯化工艺路线筛选","2027-02-01","2027-05-31","","未开始","小试工艺研究报告"],
 ["小试工艺研究","工艺参数优化（正交/响应面）","2027-05-01","2027-08-31","","未开始","工艺优化报告"],
 ["质量研究","性状/鉴别/检查项研究","2027-06-01","2027-10-31","","未开始","质量研究资料"],
 ["质量研究","含量测定方法开发","2027-08-01","2027-12-31","","未开始","含量测定方法草案"],
 ["质量研究","质量标准草案定稿","2027-12-01","2028-02-15","","未开始","质量标准草案"],
 ["方法学验证","专属性/线性/精密度等验证","2028-01-01","2028-04-30","","未开始","方法学验证报告"],
 ["中试研究","中试放大（3批）","2028-03-01","2028-06-30","","未开始","中试生产记录、3批检验报告"],
 ["稳定性研究","影响因素与加速试验启动","2028-05-01","2028-06-30","","未开始","稳定性试验方案"],
 ["稳定性研究","长期稳定性考察（ ongoing ）","2028-06-01","2029-06-30","","未开始","阶段性稳定性数据"],
 ["委外非临床研究","CRO筛选与合同签订","2027-03-01","2027-04-30","","未开始","CRO评估报告、合同"],
 ["委外非临床研究","药效学试验（委外）","2027-05-01","2027-12-31","","未开始","药效学研究报告"],
 ["委外非临床研究","急性/长期毒性试验（委外）","2027-06-01","2028-06-30","","未开始","毒理学研究报告"],
 ["委外非临床研究","药代动力学试验（委外，如需）","2028-01-01","2028-08-31","","未开始","药代研究报告"],
 ["临床方案撰写","IND申报资料框架搭建","2028-04-01","2028-05-31","","未开始","申报资料目录框架"],
 ["临床方案撰写","Ⅰ期临床试验方案撰写","2028-05-01","2028-08-31","","未开始","临床试验方案及研究者手册"],
 ["IND申报","CTD资料汇总与自查","2028-07-01","2028-09-30","","未开始","全套CTD资料"],
 ["IND申报","CDE受理与审评跟进","2028-10-01","2029-04-30","","未开始","受理通知书、批件"],
];
var defaultMile=[
 ["CRO完成筛选并签约","2027-04-30",false],"长周期毒理/稳定性项目需尽早启动，决定申报节奏",
];
function load(){
  var d=localStorage.getItem(KEY);
  if(d){d=JSON.parse(d);return d;}
  return {
    tasks: defaultTasks.map(function(t,i){return {id:i+1,mod:t[0],name:t[1],s:t[2],e:t[3],owner:t[4],st:t[5],deliver:t[6]};}),
    nextId: defaultTasks.length+1,
    files: {},
    miles: [
      {t:"药材与饮片研究完成",d:"2027-04-30",done:false},
      {t:"小试工艺确定",d:"2027-08-31",done:false},
      {t:"CRO签约（毒理+药效）",d:"2027-04-30",done:false},
      {t:"质量标准草案定稿",d:"2028-02-15",done:false},
      {t:"方法学验证完成",d:"2028-04-30",done:false},
      {t:"中试3批完成",d:"2028-06-30",done:false},
      {t:"临床试验方案定稿",d:"2028-08-31",done:false},
      {t:"CTD资料齐套",d:"2028-09-30",done:false},
      {t:"CDE受理",d:"2028-10-31",done:false},
      {t:"取得临床批件",d:"2029-04-30",done:false}
    ]
  };
}
var DB=load();
function save(){localStorage.setItem(KEY,JSON.stringify(DB));cloudPush();}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none';},1800);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ============ 导航 ============ */
function showPage(id,btn){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('nav button').forEach(function(b){b.classList.remove('active');});
  document.getElementById(id).classList.add('active');btn.classList.add('active');
  if(id==='dash')renderDash(); if(id==='gantt')renderGantt();
  if(id==='tasks')renderTasks(); if(id==='files')renderFiles(); if(id==='mile')renderMile();
}

/* ============ 看板 ============ */
function renderDash(){
  var box=document.getElementById('board');box.innerHTML='';
  MODULES.forEach(function(m){
    var ts=DB.tasks.filter(function(t){return t.mod===m;});
    var done=ts.filter(function(t){return t.st==='已完成';}).length;
    var pct=ts.length?Math.round(done/ts.length*100):0;
    var doing=ts.filter(function(t){return t.st==='进行中';}).length;
    var html='<div class="mod"><h3>'+esc(m)+'</h3><div class="phase">共 '+ts.length+' 项任务 · 进行中 '+doing+' 项</div>'+
      '<div class="bar-wrap"><div class="bar" style="width:'+pct+'%"></div></div>'+
      '<div class="pct"><span>完成进度</span><span>'+pct+'%</span></div><ul>';
    ts.forEach(function(t){
      html+='<li><span class="dot d-'+(t.st==='已完成'?'done':t.st==='进行中'?'doing':t.st==='暂停'?'hold':'todo')+'"></span>'+
        '<span class="tname" onclick="jumpTask('+t.id+')">'+esc(t.name)+'</span></li>';
    });
    html+='</ul></div>';box.innerHTML+=html;
  });
}
function jumpTask(id){
  showPage('tasks',document.querySelectorAll('nav button')[2]);startEdit(id);
}

/* ============ 甘特图 ============ */
function renderGantt(){
  var box=document.getElementById('ganttBox');
  if(!DB.tasks.length){box.innerHTML='<div class="empty">暂无任务</div>';return;}
  var min=Math.min.apply(null,DB.tasks.map(function(t){return new Date(t.s).getTime();}));
  var max=Math.max.apply(null,DB.tasks.map(function(t){return new Date(t.e).getTime();}));
  var m0=new Date(min); m0.setDate(1);
  var m1=new Date(max); m1.setMonth(m1.getMonth()+1); m1.setDate(1);
  var months=[],cur=new Date(m0);
  while(cur<m1){months.push(new Date(cur));cur.setMonth(cur.getMonth()+1);}
  var total=m1-m0;
  var h='<div class="g-head"><div class="g-task-col">任务</div><div class="g-timeline"><div class="g-months">';
  months.forEach(function(m){h+='<div class="g-month">'+m.getFullYear()+'.'+String(m.getMonth()+1).padStart(2,'0')+'</div>';});
  h+='</div></div></div>';
  DB.tasks.forEach(function(t){
    var l=(new Date(t.s)-m0)/total*100, w=(new Date(t.e)-new Date(t.s))/total*100;
    if(w<0.8)w=0.8;
    h+='<div class="g-row"><div class="g-name" title="'+esc(t.name)+'">'+esc(t.name)+'</div>'+
       '<div class="g-track"><div class="g-bar st-'+(t.st==='已完成'?'done':t.st==='进行中'?'doing':t.st==='暂停'?'hold':'todo')+'" '+
       'style="left:'+l+'%;width:'+w+'%" title="'+esc(t.name)+' | '+t.s+' ~ '+t.e+' | '+t.st+'">'+esc(t.name)+'</div></div></div>';
  });
  box.innerHTML=h;
}

/* ============ 任务 ============ */
var editingId=null, adding=false;
function editRowHtml(t){
  var modOpts=MODULES.map(function(m){return '<option'+(m===t.mod?' selected':'')+'>'+m+'</option>';}).join('');
  var stOpts=STATUSES.map(function(s){return '<option'+(s===t.st?' selected':'')+'>'+s+'</option>';}).join('');
  return '<tr style="background:#f4f9fb"><td><select id="eMod">'+modOpts+'</select></td>'+
   '<td><input type="text" id="eName" value="'+esc(t.name)+'" placeholder="任务名称" style="width:170px"><br>'+
   '<input type="text" id="eDeliver" value="'+esc(t.deliver||'')+'" placeholder="交付物（可空）" style="width:170px;margin-top:5px;font-size:12px"></td>'+
   '<td><input type="date" id="eS" value="'+t.s+'"></td>'+
   '<td><input type="date" id="eE" value="'+t.e+'"></td>'+
   '<td><input type="text" id="eOwner" value="'+esc(t.owner||'')+'" placeholder="负责人" style="width:70px"></td>'+
   '<td><select id="eSt">'+stOpts+'</select></td>'+
   '<td style="white-space:nowrap"><button class="btn sm" style="background:var(--primary);color:#fff" onclick="saveTask('+t.id+')">保存</button> '+
   '<button class="btn sm" onclick="cancelEdit()">取消</button></td></tr>';
}
function renderTasks(){
  var fm=document.getElementById('fMod').value, fs=document.getElementById('fStatus').value;
  var sel=document.getElementById('fMod');
  if(sel.options.length<=1){MODULES.forEach(function(m){var o=document.createElement('option');o.textContent=m;sel.appendChild(o);});}
  var tb=document.getElementById('taskBody');tb.innerHTML='';
  if(adding){tb.innerHTML+=editRowHtml({id:0,mod:fm||MODULES[0],name:'',s:'',e:'',owner:'',st:'未开始',deliver:''});}
  DB.tasks.filter(function(t){return (!fm||t.mod===fm)&&(!fs||t.st===fs);})
  .sort(function(a,b){return a.s<b.s?-1:1;})
  .forEach(function(t){
    if(t.id===editingId){tb.innerHTML+=editRowHtml(t);return;}
    tb.innerHTML+='<tr><td>'+esc(t.mod)+'</td><td><b class="tname" onclick="startEdit('+t.id+')">'+esc(t.name)+'</b>'+
      (t.deliver?'<br><span style="font-size:12px;color:var(--muted)">交付物：'+esc(t.deliver)+'</span>':'')+'</td>'+
      '<td style="white-space:nowrap">'+t.s+'</td><td style="white-space:nowrap">'+t.e+'</td><td>'+esc(t.owner||'—')+'</td>'+
      '<td><span class="badge b-'+t.st+'">'+t.st+'</span></td>'+
      '<td style="white-space:nowrap"><button class="btn sm" onclick="cycleStatus('+t.id+')">流转状态</button> '+
      '<button class="btn sm" onclick="startEdit('+t.id+')">编辑</button> '+
      '<button class="btn sm del" onclick="delTask('+t.id+')">删除</button></td></tr>';
  });
  if(!tb.innerHTML)tb.innerHTML='<tr><td colspan="7" class="empty">没有匹配的任务</td></tr>';
}
function startEdit(id){editingId=id;adding=false;renderTasks();}
function startAdd(){adding=true;editingId=null;renderTasks();}
function cancelEdit(){editingId=null;adding=false;renderTasks();}
function saveTask(id){
  var v={mod:document.getElementById('eMod').value,
    name:document.getElementById('eName').value.trim(),
    s:document.getElementById('eS').value,e:document.getElementById('eE').value,
    owner:document.getElementById('eOwner').value.trim(),
    st:document.getElementById('eSt').value,
    deliver:document.getElementById('eDeliver').value.trim()};
  if(!v.name){alert('任务名称不能为空');return;}
  if(!v.s||!v.e){alert('请填写开始和结束日期');return;}
  if(id===0){v.id=DB.nextId++;DB.tasks.push(v);}
  else{var t=DB.tasks.find(function(x){return x.id===id;});for(var k in v)t[k]=v[k];}
  editingId=null;adding=false;save();renderTasks();toast('已保存');
}
function cycleStatus(id){
  var t=DB.tasks.find(function(x){return x.id===id;});
  t.st=STATUSES[(STATUSES.indexOf(t.st)+1)%STATUSES.length];
  save();renderTasks();toast('状态已更新为：'+t.st);
}
function delTask(id){
  if(!confirm('确定删除该任务？'))return;
  DB.tasks=DB.tasks.filter(function(x){return x.id!==id;});save();renderTasks();toast('已删除');
}

/* ============ 文件 ============ */
function renderFiles(){
  var box=document.getElementById('fileBox');box.innerHTML='';
  MODULES.forEach(function(m){
    var fs=DB.files[m]||[];
    var h='<div class="mod"><h3>'+esc(m)+'</h3>';
    if(fs.length){fs.forEach(function(f,i){
      h+='<div class="fitem"><a href="'+esc(f.url)+'" target="_blank">📄 '+esc(f.name)+'</a>'+
         '<button class="btn sm del" onclick="delFile(\''+m.replace(/'/g,"")+'\','+i+')">删</button></div>';
    });}else h+='<div class="empty">暂无归档文件</div>';
    h+='<div style="margin-top:10px"><button class="btn sm" onclick="addFile(\''+m.replace(/'/g,"")+'\')">＋ 添加文件链接</button></div></div>';
    box.innerHTML+=h;
  });
}
function addFile(mod){
  var name=prompt('文件名/说明：');if(!name)return;
  var url=prompt('链接地址（可填网盘分享链接、在线文档地址等）：','http://');if(url===null)return;
  if(!DB.files[mod])DB.files[mod]=[];
  DB.files[mod].push({name:name,url:url});save();renderFiles();toast('已添加');
}
function delFile(mod,i){DB.files[mod].splice(i,1);save();renderFiles();}

/* ============ 里程碑 ============ */
function renderMile(){
  var box=document.getElementById('mileBox');box.innerHTML='';
  DB.miles.forEach(function(m,i){
    box.innerHTML+='<div class="mi'+(m.done?' done':'')+'"><h4>'+(m.done?'✅ ':'')+esc(m.t)+' <span style="color:var(--muted);font-weight:400;font-size:12px">'+m.d+'</span></h4>'+
      '<p><a href="javascript:void(0)" onclick="toggleMile('+i+')" style="color:var(--primary);font-size:12px">'+(m.done?'标记为未完成':'标记为已完成')+'</a></p></div>';
  });
}
function toggleMile(i){DB.miles[i].done=!DB.miles[i].done;save();renderMile();}

/* ============ 导入导出 ============ */
function exportData(){
  var blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='中药研发项目备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importData(ev){
  var f=ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){try{DB=JSON.parse(r.result);save();toast('导入成功');location.reload();}catch(e){alert('文件格式错误');}};
  r.readAsText(f);
}

var sb=null, sbUser=null, cloudTimer=null;
function sbInit(){
  var c=localStorage.getItem('sbCfg');

  if(c&&window.supabase){
    try{c=JSON.parse(c);sb=supabase.createClient(c.url,c.key);}catch(e){sb=null;}

function cloudPush(){
  if(!sb||!sbUser)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(function(){
    sb.from('project_data').upsert({id:1,data:DB,updated_at:new Date().toISOString()})
      .then(function(r){if(r.error)console.log('云端同步失败',r.error.message);});
  },800);

async function cloudLoad(){

function showLogin(){
  var m=document.getElementById('loginMask');m.style.display='flex';
  var hasCfg=!!localStorage.getItem('sbCfg')||!!SB_DEFAULT.url;
  document.getElementById('cfgBox').style.display=hasCfg?'none':'block';
  document.getElementById('authBox').style.display=hasCfg?'block':'none';
}
function hideLogin(){
  document.getElementById('loginMask').style.display='none';
  document.getElementById('sbOutBtn').style.display='';
}
function saveCfg(){
  var u=document.getElementById('sbUrl').value.trim(),k=document.getElementById('sbKey').value.trim();
  if(!u||!k){document.getElementById('cfgMsg').textContent='两项都要填';return;}
  if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/i.test(u)){document.getElementById('cfgMsg').textContent='URL 只能是 https://xxxx.supabase.co 这种格式，不能带斜杠后面的内容';return;}
  if(!window.supabase){document.getElementById('cfgMsg').textContent='在线组件加载失败，请检查网络后刷新页面重试';return;}
  localStorage.setItem('sbCfg',JSON.stringify({url:u,key:k}));
  sbInit();
  document.getElementById('cfgBox').style.display='none';
  document.getElementById('authBox').style.display='block';
  document.getElementById('authMsg').textContent='配置已保存，请登录或注册';
}
async function doLogin(){
  var em=document.getElementById('sbEmail').value.trim(),pw=document.getElementById('sbPwd').value;
  var r=await sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error){document.getElementById('authMsg').textContent=r.error.message;return;}
  sbUser=r.data.user;hideLogin();toast('登录成功，正在同步云端数据…');await cloudLoad();renderDash();
}
async function doSignup(){
  var em=document.getElementById('sbEmail').value.trim(),pw=document.getElementById('sbPwd').value;
  if(pw.length<6){document.getElementById('authMsg').textContent='密码至少6位';return;}
  var r=await sb.auth.signUp({email:em,password:pw});
  if(r.error){document.getElementById('authMsg').textContent=r.error.message;return;}
  if(r.data.session){sbUser=r.data.user;hideLogin();toast('注册成功，已自动登录');cloudPush();}
  else{document.getElementById('authMsg').textContent='注册成功！请到邮箱点击确认邮件后再登录（或在Supabase后台关闭邮箱确认）';}
}
function resetCfg(){
  localStorage.removeItem('sbCfg');sb=null;sbUser=null;
  document.getElementById('authBox').style.display='none';
  document.getElementById('cfgBox').style.display='block';
  document.getElementById('cfgMsg').textContent='';
}
function skipLogin(){document.getElementById('loginMask').style.display='none';toast('已进入本地模式，右上角可重新登录');}
async function doLogout(){
  await sb.auth.signOut();sbUser=null;
  document.getElementById('sbOutBtn').style.display='none';showLogin();
}
