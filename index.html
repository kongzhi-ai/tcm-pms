<style>
:root{
  --primary:#1a6f8a; --primary-dark:#12556b; --accent:#c8a24b;
  --bg:#f4f6f8; --card:#ffffff; --text:#2b3a42; --muted:#7a8a93;
  --green:#3a9d6e; --orange:#e08a2e; --red:#c94f4f; --gray:#aab6bd;
  --radius:10px; --shadow:0 1px 4px rgba(30,60,75,.08),0 4px 14px rgba(30,60,75,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:linear-gradient(120deg,var(--primary),var(--primary-dark));color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
header h1{font-size:20px;font-weight:600;letter-spacing:1px}
header .sub{font-size:12px;opacity:.85;margin-top:4px}
header .actions button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;margin-left:8px}
header .actions button:hover{background:rgba(255,255,255,.28)}
nav{background:var(--card);display:flex;padding:0 28px;border-bottom:1px solid #e3e9ec;position:sticky;top:0;z-index:50}
nav button{background:none;border:none;padding:14px 20px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;font-family:inherit}
nav button.active{color:var(--primary);border-bottom-color:var(--accent);font-weight:600}
nav button:hover{color:var(--primary)}
main{padding:24px 28px;max-width:1400px;margin:0 auto}
.page{display:none}.page.active{display:block}
h2.section{font-size:16px;margin:6px 0 16px;color:var(--primary-dark);border-left:4px solid var(--accent);padding-left:10px}
/* 看板 */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mod{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.mod h3{font-size:15px;margin-bottom:4px}
.mod .phase{font-size:12px;color:var(--muted);margin-bottom:12px}
.bar-wrap{background:#eef2f4;border-radius:6px;height:8px;overflow:hidden;margin-bottom:8px}
.bar{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary),#3fa3bd);transition:width .5s}
.mod .pct{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:10px}
.mod ul{list-style:none;font-size:13px}
.mod li{padding:5px 0;border-top:1px dashed #edf1f3;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.d-done{background:var(--green)}.d-doing{background:var(--orange)}.d-todo{background:var(--gray)}.d-hold{background:var(--red)}
/* 甘特图 */
.gantt-scroll{overflow-x:auto;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.gantt{display:grid;min-width:900px}
.g-head{display:flex;border-bottom:2px solid #e3e9ec;padding-bottom:8px;font-size:12px;color:var(--muted)}
.g-task-col{width:230px;flex-shrink:0;padding-right:10px;font-weight:600;color:var(--text)}
.g-timeline{flex:1;position:relative}
.g-months{display:flex}
.g-years{display:flex;border-bottom:1px solid #d8e2e7}
.g-year{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--primary-dark);padding:3px 0;background:#eef4f6}
.g-yb{border-left:2px solid #8fa9b4 !important}
.g-month{flex:1;text-align:center;border-left:1px solid #eef2f4;font-size:11px;white-space:nowrap;padding:2px 0}
.g-row{display:flex;align-items:center;border-bottom:1px solid #f2f5f7;padding:7px 0}
.g-name{width:230px;flex-shrink:0;padding-right:10px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-track{flex:1;position:relative;height:20px}
.g-bar{position:absolute;height:16px;top:2px;border-radius:4px;font-size:10px;color:#fff;line-height:16px;padding:0 6px;overflow:hidden;white-space:nowrap;cursor:default}
.st-todo{background:var(--gray)}.st-doing{background:var(--orange)}.st-done{background:var(--green)}.st-hold{background:var(--red)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin:12px 0;flex-wrap:wrap}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
/* 表格通用 */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
select,input[type=text],input[type=date]{padding:8px 10px;border:1px solid #d6dee2;border-radius:6px;font-size:13px;font-family:inherit;background:#fff;color:var(--text)}
.btn{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
.btn:hover{background:var(--primary-dark)}
.btn.sm{padding:4px 10px;font-size:12px;background:#eef3f5;color:var(--primary);border:1px solid #d6dee2}
.btn.sm:hover{background:#dce9ee}
.btn.del{background:#fdf0f0;color:var(--red);border-color:#f0d5d5}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f2f6f8;color:var(--primary-dark);text-align:left;padding:10px 8px;font-weight:600;white-space:nowrap}
td{padding:9px 8px;border-top:1px solid #eef2f4;vertical-align:middle}
tr:hover td{background:#f8fbfc}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;white-space:nowrap}
.b-未开始{background:#eef1f3;color:#7a8a93}.b-进行中{background:#fdf3e4;color:#b96f14}
.b-已完成{background:#e6f4ec;color:#22784f}.b-暂停{background:#fbeaea;color:#a83a3a}
.tname{cursor:pointer}.tname:hover{color:var(--primary);text-decoration:underline}
/* 文件 */
.file-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.filecard{height:150px;cursor:pointer;transition:box-shadow .2s}
.addmod{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);border:2px dashed #c9d4da;cursor:pointer;min-height:150px;font-size:14px;gap:6px}
.addmod:hover{color:var(--primary);border-color:var(--primary)}
.moves{float:right}
.sbtn{background:#eef3f5;border:1px solid #d6dee2;border-radius:4px;color:var(--primary);cursor:pointer;font-size:11px;padding:1px 6px;margin-left:4px;font-family:inherit}
.sbtn:hover{background:var(--primary);color:#fff}
.g-nobar{font-size:11px;color:var(--muted);background:#f0f3f5;border-radius:4px;padding:1px 8px}
.gm-block{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
.gm-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid #edf1f3;padding-bottom:8px;margin-bottom:6px}
.gm-toggle{cursor:pointer;color:var(--primary);font-size:12px;width:16px;text-align:center;flex-shrink:0;user-select:none}
.gm-title{font-weight:600;font-size:14px;color:var(--primary-dark);cursor:pointer;flex-shrink:0}
.gm-title:hover{color:var(--primary)}
.gm-count{color:var(--muted);font-weight:400;font-size:12px}
.gm-hint{font-size:12px;color:var(--muted);margin-left:auto}
.gm-bar-sum{background:linear-gradient(90deg,var(--primary),var(--accent))}
.filecard:hover{box-shadow:0 4px 18px rgba(30,60,75,.16);outline:1px solid var(--primary)}
#pvMask{display:none;position:fixed;inset:0;background:rgba(20,40,50,.6);z-index:300;align-items:center;justify-content:center}
.pvbox{background:#fff;border-radius:12px;padding:20px;width:min(880px,94vw);max-height:88vh;overflow:auto}
.fitem{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid #eef2f4;border-radius:8px;margin-top:8px;font-size:13px;background:#fbfdfe}
.fitem a{color:var(--primary);text-decoration:none;word-break:break-all}
.fitem a:hover{text-decoration:underline}
.empty{color:var(--muted);font-size:12px;padding:8px 0}
/* 里程碑 */
.timeline{position:relative;padding-left:26px}
.timeline:before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:#d9e4e9}
.mi{position:relative;margin-bottom:22px}
.mi:before{content:'';position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary)}
.mi.done:before{background:var(--green);box-shadow:0 0 0 2px var(--green)}
.mi h4{font-size:14px}.mi p{font-size:12px;color:var(--muted);margin-top:3px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2b3a42;color:#fff;padding:10px 22px;border-radius:8px;font-size:13px;display:none;z-index:99}
@media(max-width:700px){main{padding:14px}nav{padding:0 10px;overflow-x:auto}header{padding:14px}}


input[type=email],input[type=password]{padding:8px 10px;border:1px solid #d6dee2;border-radius:6px;font-size:13px;font-family:inherit;background:#fff;color:var(--text)}
</style>
</head>

/* ============ 甘特图 ============ */
var ganttExpanded={};
function toggleGanttMod(m){ganttExpanded[m]=!ganttExpanded[m];renderGantt();}
function ganttAxisHtml(m0,m1){
  var months=[],cur=new Date(m0);
  while(cur<m1){months.push(new Date(cur));cur.setMonth(cur.getMonth()+1);}
  var yearsHtml='',monthsHtml='',i=0;
  while(i<months.length){
    var y=months[i].getFullYear(),c=0;
    while(i+c<months.length&&months[i+c].getFullYear()===y)c++;
    yearsHtml+='<div class="g-year'+(yearsHtml?' g-yb':'')+'" style="flex:'+c+'">'+y+'年</div>';
    i+=c;
  }
  months.forEach(function(m,idx){
    monthsHtml+='<div class="g-month'+(m.getMonth()===0&&idx>0?' g-yb':'')+'">'+(m.getMonth()+1)+'月</div>';
  });
  return '<div class="g-years">'+yearsHtml+'</div><div class="g-months">'+monthsHtml+'</div>';
}
function renderGantt(){
  var box=document.getElementById('ganttBox');
  if(!DB.tasks.length){box.innerHTML='<div class="empty">暂无任务</div>';return;}
  var hasDate=function(t){return t.s&&t.e&&!isNaN(new Date(t.s))&&!isNaN(new Date(t.e));};
  var html='';
  MODS().forEach(function(m){
    var items=DB.tasks.filter(function(t){return t.mod===m;});
    var dated=items.filter(hasDate);
    var open=!!ganttExpanded[m];
    var head='<span class="gm-toggle">'+(open?'▼':'▶')+'</span>'+
      '<span class="gm-title" onclick="toggleGanttMod(\''+m.replace(/'/g,'')+'\')">'+esc(m)+
      '<span class="gm-count">（'+items.length+' 项）</span></span>';
    html+='<div class="gm-block">';
    if(!dated.length){
      html+='<div class="gm-head">'+head+
        '<span class="gm-hint">该模块暂无排期，请先在任务清单中填写开始/结束日期</span></div>';
      if(open&&items.length){
        html+='<div class="gm-rows">'+items.map(function(t){
          return '<div class="g-row"><div class="g-name" title="'+esc(t.name)+'">'+esc(t.name)+'</div>'+
                 '<div class="g-track"><span class="g-nobar">未排期</span></div></div>';
        }).join('')+'</div>';
      }
      html+='</div>';return;
    }
    var min=Math.min.apply(null,dated.map(function(t){return new Date(t.s).getTime();}));
    var max=Math.max.apply(null,dated.map(function(t){return new Date(t.e).getTime();}));
    var m0=new Date(min);m0.setDate(1);
    var m1=new Date(max);m1.setMonth(m1.getMonth()+1);m1.setDate(1);
    var total=m1-m0;
    html+='<div class="gm-head">'+head+'<div class="g-timeline">'+ganttAxisHtml(m0,m1)+'</div></div>';
    // 模块汇总行
    var sMin=Math.min.apply(null,dated.map(function(t){return new Date(t.s).getTime();}));
    var eMax=Math.max.apply(null,dated.map(function(t){return new Date(t.e).getTime();}));
    var l=(sMin-m0)/total*100,w=(eMax-sMin)/total*100;if(w<0.8)w=0.8;
    html+='<div class="gm-rows"><div class="g-row gm-summary">'+
      '<div class="g-name">▸ 模块整体</div>'+
      '<div class="g-track"><div class="g-bar gm-bar-sum" style="left:'+l+'%;width:'+w+'%" title="'+esc(m)+' | '+new Date(sMin).toISOString().slice(0,10)+' ~ '+new Date(eMax).toISOString().slice(0,10)+'"></div></div></div>';
    if(open){
      items.forEach(function(t){
        if(!hasDate(t)){
          html+='<div class="g-row"><div class="g-name" title="'+esc(t.name)+'">'+esc(t.name)+'</div>'+
               '<div class="g-track"><span class="g-nobar">未排期</span></div></div>';
          return;
        }
        var ll=(new Date(t.s)-m0)/total*100, ww=(new Date(t.e)-new Date(t.s))/total*100;
        if(ww<0.8)ww=0.8;
        html+='<div class="g-row"><div class="g-name" title="'+esc(t.name)+'">'+esc(t.name)+'</div>'+
          '<div class="g-track"><div class="g-bar st-'+(t.st==='已完成'?'done':t.st==='进行中'?'doing':t.st==='暂停'?'hold':'todo')+'" '+
          'style="left:'+ll+'%;width:'+ww+'%" title="'+esc(t.name)+' | '+t.s+' ~ '+t.e+' | '+t.st+'">'+esc(t.name)+'</div></div></div>';
      });
    }
    html+='</div></div>';
  });
  box.innerHTML=html;
}

function renderTasks(){
  var fm=document.getElementById('fMod').value, fs=document.getElementById('fStatus').value;
  var sel=document.getElementById('fMod');
  sel.innerHTML='<option value="">全部模块</option>';
  MODS().forEach(function(m){var o=document.createElement('option');o.textContent=m;sel.appendChild(o);});
  sel.value=fm;
  var tb=document.getElementById('taskBody');tb.innerHTML='';
  if(adding){tb.innerHTML+=editRowHtml({id:0,mod:fm||MODULES[0],name:'',s:'',e:'',owner:'',st:'未开始',deliver:''});}
  DB.tasks.filter(function(t){return (!fm||t.mod===fm)&&(!fs||t.st===fs);})
  .sort(function(a,b){var ma=MODS(),d=ma.indexOf(a.mod)-ma.indexOf(b.mod);if(d)return d;return String(a.s).localeCompare(String(b.s));})
  .forEach(function(t){
    if(t.id===editingId){tb.innerHTML+=editRowHtml(t);return;}
    tb.innerHTML+='<tr><td>'+esc(t.mod)+'</td><td><b class="tname" onclick="startEdit('+t.id+')">'+esc(t.name)+'</b>'+
      (t.deliver?'<br><span style="font-size:12px;color:var(--muted)">交付物：'+esc(t.deliver)+'</span>':'')+'</td>'+

      '<td><span class="badge b-'+t.st+'">'+t.st+'</span></td>'+
      '<td style="white-space:nowrap"><button class="btn sm" onclick="cycleStatus('+t.id+')">流转状态</button> '+
      '<button class="btn sm" onclick="startEdit('+t.id+')">编辑</button> '+
      '<button class="btn sm del" onclick="delTask('+t.id+')">删除</button></td></tr>';
  });
  if(!tb.innerHTML)tb.innerHTML='<tr><td colspan="7" class="empty">没有匹配的任务</td></tr>';
}
function startEdit(id){editingId=id;adding=false;renderTasks();}
function startAdd(){adding=true;editingId=null;renderTasks();}
function cancelEdit(){editingId=null;adding=false;renderTasks();}
function saveTask(id){
  var v={mod:document.getElementById('eMod').value,
    name:document.getElementById('eName').value.trim(),
    s:document.getElementById('eS').value,e:document.getElementById('eE').value,
    owner:document.getElementById('eOwner').value.trim(),
    st:document.getElementById('eSt').value,
    deliver:document.getElementById('eDeliver').value.trim()};
  if(!v.name){alert('任务名称不能为空');return;}
  if(id===0){v.id=DB.nextId++;DB.tasks.push(v);}
  else{var t=DB.tasks.find(function(x){return x.id===id;});for(var k in v)t[k]=v[k];}
  editingId=null;adding=false;save();renderTasks();toast('已保存');
}
function cycleStatus(id){
  var t=DB.tasks.find(function(x){return x.id===id;});
  t.st=STATUSES[(STATUSES.indexOf(t.st)+1)%STATUSES.length];
  save();renderTasks();toast('状态已更新为：'+t.st);
}
function delTask(id){
  if(!confirm('确定删除该任务？'))return;
  DB.tasks=DB.tasks.filter(function(x){return x.id!==id;});save();renderTasks();toast('已删除');
}

var upMod=null, curFileMod=null, fileSort='time';
function getTs(f){if(f.ts)return f.ts;var m=(f.path||'').match(/\/(\d{10,14})\./);return m?+m[1]:0;}
function getExt(f){var m=(f.name||'').match(/\.([A-Za-z0-9]+)$/);return m?m[1].toLowerCase():'';}
function fmtSize(s){return s?(s/1048576>=1?(s/1048576).toFixed(1)+' MB':Math.ceil(s/1024)+' KB'):'—';}
function renderFiles(){
  var box=document.getElementById('fileBox');box.innerHTML='';
  MODS().forEach(function(m){
    var fs=DB.files[m]||[];
    var latest=null;
    fs.forEach(function(f){if(!latest||getTs(f)>getTs(latest))latest=f;});

function setFileSort(s){fileSort=s;renderFileDetail();}
function refreshFileViews(){renderFiles();if(document.getElementById('filedetail').classList.contains('active'))renderFileDetail();}
function renderFileDetail(){
  var mod=curFileMod;
  document.getElementById('fdTitle').textContent=mod+' · 共 '+(DB.files[mod]||[]).length+' 个文件';
  var tb=document.getElementById('fdBody');tb.innerHTML='';
  var fs=(DB.files[mod]||[]).slice();
  fs.sort(function(a,b){
    if(fileSort==='name')return (a.name||'').localeCompare(b.name||'','zh');
    if(fileSort==='type')return getExt(a).localeCompare(getExt(b))||getTs(b)-getTs(a);
    return getTs(b)-getTs(a);
  });
  if(!fs.length){tb.innerHTML='<tr><td colspan="5" class="empty">暂无文件，点左上角上传</td></tr>';return;}
  fs.forEach(function(f){
    var i=(DB.files[mod]||[]).indexOf(f);
    var ext=getExt(f);
    var typeTxt=f.path?(ext?ext.toUpperCase()+' 文件':'文件'):'外部链接';
    tb.innerHTML+='<tr><td>'+esc(f.name)+'</td><td>'+typeTxt+'</td><td>'+fmtSize(f.size)+'</td><td>'+(f.time||'—')+'</td>'+
    '<td style="white-space:nowrap">'+
    '<button class="btn sm" onclick="previewFile(\''+mod.replace(/'/g,'')+'\','+i+')">预览</button> '+
    (f.path?'<button class="btn sm" onclick="downloadFile(\''+f.path+'\',\''+String(f.name).replace(/'/g,'')+'\')">下载</button> '
          :'<a class="btn sm" href="'+esc(f.url)+'" target="_blank" style="text-decoration:none">打开</a> ')+
    '<button class="btn sm del" onclick="delFile(\''+mod.replace(/'/g,'')+'\','+i+')">删</button></td></tr>';
  });
}

async function doUpload(ev){
  var f=ev.target.files[0];if(!f||!upMod)return;
  var idx=MODS().indexOf(upMod);
  var ext=(f.name.match(/\.[A-Za-z0-9]{1,10}$/)||[''])[0].toLowerCase();
  var path='m'+(idx+1)+'/'+Date.now()+ext;
  toast('正在上传：'+f.name+' …');
  var r=await sb.storage.from('project-files').upload(path,f);
  if(r.error){alert('上传失败：'+r.error.message+'\n请确认已按说明创建存储空间');return;}
  if(!DB.files[upMod])DB.files[upMod]=[];
  DB.files[upMod].push({name:f.name,path:path,size:f.size,ts:Date.now(),time:new Date().toLocaleString('zh-CN')});
  save();refreshFileViews();toast('上传完成');
}
async function downloadFile(path,name){
  if(!sb||!sbUser){toast('请先登录');return;}
  var r=await sb.storage.from('project-files').download(path);
  if(r.error){alert('下载失败：'+r.error.message);return;}
  var a=document.createElement('a');a.href=URL.createObjectURL(r.data);a.download=name;a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
}
async function previewFile(mod,i){
  var f=DB.files[mod][i];
  if(!f.path){window.open(f.url,'_blank');return;}
  if(!sb||!sbUser){toast('请先登录');return;}
  var mask=document.getElementById('pvMask'),box=document.getElementById('pvBox');
  document.getElementById('pvTitle').textContent=f.name;
  box.innerHTML='<div class="empty">加载中…</div>';mask.style.display='flex';
  var ext=getExt(f);
  var r=await sb.storage.from('project-files').download(f.path);
  if(r.error){box.innerHTML='<div class="empty">预览失败：'+esc(r.error.message)+'</div>';return;}
  var u=URL.createObjectURL(r.data);
  if(/^(png|jpe?g|gif|webp|bmp)$/.test(ext))box.innerHTML='<img src="'+u+'" style="max-width:100%;max-height:70vh;display:block;margin:0 auto">';
  else if(ext==='pdf')box.innerHTML='<iframe src="'+u+'" style="width:100%;height:70vh;border:none"></iframe>';
  else if(/^(txt|csv|md|log|json)$/.test(ext)){var t=await r.data.text();box.innerHTML='<pre style="white-space:pre-wrap;max-height:70vh;overflow:auto;font-size:13px;background:#f7f9fa;padding:12px;border-radius:8px">'+esc(t.slice(0,200000))+'</pre>';}
  else box.innerHTML='<div class="empty" style="text-align:center;padding:30px 0">该格式（'+(ext||'未知').toUpperCase()+'）暂不支持在线预览，请下载后查看</div>';
}

function exportData(){

function diffReport(o,n){
  var rep={add:[],upd:[],del:[],mAdd:[],mDel:[],fAdd:0,fDel:0};
  var om={},nm={};
  (o.tasks||[]).forEach(function(t){om[t.id]=t;});
  (n.tasks||[]).forEach(function(t){nm[t.id]=t;
    if(!om[t.id])rep.add.push(t.name||('任务'+t.id));
    else if(JSON.stringify(om[t.id])!==JSON.stringify(t))rep.upd.push(t.name||('任务'+t.id));});
  (o.tasks||[]).forEach(function(t){if(!nm[t.id])rep.del.push(t.name||('任务'+t.id));});
  var oms={},nms={};
  (o.miles||[]).forEach(function(m){oms[m.t+'|'+m.d]=1;});
  (n.miles||[]).forEach(function(m){nms[m.t+'|'+m.d]=1;if(!oms[m.t+'|'+m.d])rep.mAdd.push(m.t);});
  (o.miles||[]).forEach(function(m){if(!nms[m.t+'|'+m.d])rep.mDel.push(m.t);});
  var of=o.files||{},nf=n.files||{};
  Object.keys(nf).forEach(function(m){(nf[m]||[]).forEach(function(f){
    var ex=(of[m]||[]).some(function(x){return x.name===f.name&&x.path===f.path&&x.url===f.url;});
    if(!ex)rep.fAdd++;});});
  Object.keys(of).forEach(function(m){(of[m]||[]).forEach(function(f){
    var ex=(nf[m]||[]).some(function(x){return x.name===f.name&&x.path===f.path&&x.url===f.url;});
    if(!ex)rep.fDel++;});});
  return rep;
}
function importData(ev){
  var f=ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var incoming=JSON.parse(r.result);
      if(!incoming||!Array.isArray(incoming.tasks)){alert('文件格式错误：缺少任务数据');ev.target.value='';return;}
      var rep=diffReport(DB||{tasks:[],miles:[],files:{}},incoming);
      var L=function(a){return !a.length?'':(a.length<=8?a.join('、'):a.slice(0,8).join('、')+' 等 '+a.length+' 项');};
      var msg='导入后，当前项目将被备份文件内容替换：\n\n';
      if(rep.add.length)msg+='【新增任务】'+L(rep.add)+'\n';
      if(rep.upd.length)msg+='【覆盖修改】'+L(rep.upd)+'\n';
      if(rep.del.length)msg+='【删除任务】'+L(rep.del)+'\n';
      if(rep.mAdd.length)msg+='【新增里程碑】'+L(rep.mAdd)+'\n';
      if(rep.mDel.length)msg+='【删除里程碑】'+L(rep.mDel)+'\n';
      msg+='【文件记录】新增 '+rep.fAdd+' 条，删除 '+rep.fDel+' 条\n';
      if(!rep.add.length&&!rep.upd.length&&!rep.del.length&&!rep.mAdd.length&&!rep.mDel.length&&!rep.fAdd&&!rep.fDel)
        msg+='（与当前数据完全一致）\n';
      msg+='\n确定导入并覆盖当前项目吗？';
      if(!confirm(msg)){ev.target.value='';return;}
      DB=incoming;
      if(!DB.files)DB.files={};
      if(!DB.miles)DB.miles=[];
      ensureMods();
      save();
      toast('导入成功');location.reload();
    }catch(e){alert('文件格式错误');}
  };
  r.readAsText(f);
}
